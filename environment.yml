name: morphast
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10.19
  - numpy=2.2.6
  - pandas=2.3.3
  - scipy=1.15.2
  - scikit-learn=1.7.2
  - scikit-image=0.25.2
  - matplotlib=3.10.7
  - pillow=11.3.0
  - tifffile=2024.12.12
  # PyTorch: pinned to the version used in the paper. Choose the matching
  # CUDA build for your hardware (or drop pytorch-cuda for CPU-only).
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.1
  - pip
  - pip:
      - timm==1.0.21
      - omnipose==1.0.6      # standalone Omnipose package, NOT cellpose-omni
      - imageio==2.37.0
# Notes on reproducibility:
# - cuDNN: 9.1.0 (bundled with the pytorch build above on the paper's hardware)
# - GPU at paper time: NVIDIA RTX A6000 (48 GB)
# - OS: Linux 4.18.0 (RHEL 8.5)
# Re-pin to your installed versions for bit-level reproducibility.
